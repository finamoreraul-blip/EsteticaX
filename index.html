<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');
    body{font-family:'Poppins',sans-serif;margin:0;background:#FFF8F5;color:#333;font-size:16px}
.header{background:linear-gradient(135deg, #FFB8D1 0%, #FF6B9D 100%);padding:40px 20px;text-align:center;color:white}
.logo{font-size:3.5rem;font-weight:900;letter-spacing:3px;margin:0}
.slogan{font-size:1.2rem;margin-top:10px;opacity:0.9}
.portada{width:100%;max-height:500px;object-fit:cover;display:block}
.section{padding:60px 20px;max-width:900px;margin:auto}
    h2{text-align:center;font-size:2.5rem;color:#FF6B9D;margin-bottom:40px}
.info-box{background:white;border-radius:20px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,0.08);margin-bottom:40px;text-align:center;border:2px solid #FFB8D1} /* borde rosa */
.info-box h3{color:#FF6B9D;margin-top:0;font-size:1.6rem}
.info-item{margin:15px 0;font-size:1.2rem}
.servicio-card{background:white;border-radius:20px;padding:30px;box-shadow:0 4px 20px rgba(255,184,209,0.3);margin-bottom:30px;text-align:center;border:1px solid #FFB8D1} /* sombra rosa */
.servicio-nombre{font-size:1.7rem;font-weight:bold;color:#333;margin:0}
.servicio-nombre::before{content:"💅 ";} /* uñita antes del título */
.servicio-precio{font-size:1.4rem;color:#FF6B9D;font-weight:bold;margin:8px 0 20px 0}
.servicio-desc{color:#666;margin-bottom:20px;font-size:1.1rem}
.carrusel-contenedor{position:relative;width:100%;max-width:400px;margin:0 auto 20px auto;border-radius:15px;overflow:hidden;border:3px solid #FFB8D1} /* marco rosa al carrusel */
.carrusel{position:relative;width:100%;height:400px}
.slide{position:absolute;width:100%;height:100%;opacity:0;transition:opacity 0.5s ease-in-out}
.slide.activo{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;border-radius:15px}
.flecha{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,184,209,0.9);border:none;color:white;font-size:24px;padding:10px 15px;border-radius:50%;cursor:pointer;z-index:10} /* flechas rosas */
.flecha:hover{background:#FF6B9D}
.prev{left:10px}.next{right:10px}
.puntos{text-align:center;margin-top:12px}
.punto{display:inline-block;width:10px;height:10px;background:#FFB8D1;border-radius:50%;margin:0 5px;cursor:pointer}
.punto.activo{background:#FF6B9D;transform:scale(1.3)}
.btn-agendar{background:linear-gradient(135deg, #FFB8D1 0%, #FF6B9D 100%);color:white;padding:16px 35px;border-radius:50px;text-decoration:none;font-weight:bold;display:inline-block;text-align:center;margin-top:10px;border:none;cursor:pointer;font-size:1.1rem;box-shadow:0 4px 15px rgba(255,107,157,0.3)} /* degradado rosa */
.btn-agendar:hover{transform:scale(1.05);transition:0.3s}
    
/* POPUP FEMENINO */
.popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,184,209,0.5);z-index:1000;justify-content:center;align-items:center;backdrop-filter:blur(5px)} /* fondo rosa difuminado */
.popup-contenido{background:white;width:90%;max-width:700px;height:80%;border-radius:25px;position:relative;padding:20px;border:4px solid #FFB8D1;box-shadow:0 0 30px rgba(255,107,157,0.4)}
.cerrar{position:absolute;top:10px;right:20px;font-size:30px;cursor:pointer;color:#FF6B9D;font-weight:bold}
.cerrar:hover{color:#FF1493}
.popup-header{text-align:center;padding-bottom:10px;border-bottom:2px dashed #FFB8D1;margin-bottom:10px} /* separador rosa */
.popup-header h3{color:#FF6B9D;margin:0;font-size:1.5rem}
.popup-header p{color:#999;margin:5px 0 0 0;font-size:0.9rem}
.popup iframe{width:100%;height:calc(100% - 60px);border:none;border-radius:15px}
.btn-wpp{position:fixed;bottom:20px;right:20px;background:#25D366;color:white;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;text-decoration:none;box-shadow:0 4px 15px rgba(0,0,0,0.2);z-index:999}

  @media (max-width: 768px){
  .logo{font-size:2.5rem}
    h2{font-size:2rem}
  .servicio-nombre{font-size:1.4rem}
  .section{padding:40px 15px}
  .carrusel{height:300px}
  }
  </style>
