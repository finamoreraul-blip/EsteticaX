
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>esteticaX | Nails & Pestañas Tres Arroyos</title>
  <style>
    body{font-family:'Poppins',sans-serif;margin:0;background:#FFF8F5;color:#333}

    /* HEADER */
   .header{background:linear-gradient(135deg, #FFB8D1 0%, #FF6B9D 100%);padding:40px 20px;text-align:center;color:white}
   .logo{font-size:3.5rem;font-weight:900;letter-spacing:3px;margin:0}
   .slogan{font-size:1.1rem;margin-top:10px;opacity:0.9}

   .section{padding:60px 20px;max-width:900px;margin:auto}
    h2{text-align:center;font-size:2.5rem;color:#FF6B9D;margin-bottom:40px}

    /* CARD SERVICIO */
   .servicio-card{background:white;border-radius:20px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,0.08);margin-bottom:30px}
   .servicio-nombre{font-size:1.6rem;font-weight:bold;color:#333;margin:0}
   .servicio-precio{font-size:1.3rem;color:#FF6B9D;font-weight:bold;margin:8px 0 20px 0}

    /* CARRUSEL PRO */
   .carrusel-contenedor{position:relative;width:100%;max-width:400px;margin:auto;border-radius:15px;overflow:hidden}
   .carrusel{position:relative;width:100%;height:400px}
   .slide{position:absolute;width:100%;height:100%;opacity:0;transition:opacity 0.5s ease-in-out}
   .slide.activo{opacity:1}
   .slide img{width:100%;height:100%;object-fit:cover;border-radius:15px;background:#F5F5F5;border:2px dashed #FFB8D1}

    /* FLECHAS */
   .flecha{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.8);border:none;color:#FF6B9D;font-size:24px;padding:10px 15px;border-radius:50%;cursor:pointer;z-index:10}
   .flecha:hover{background:white}
   .prev{left:10px}
   .next{right:10px}

    /* PUNTITOS */
   .puntos{text-align:center;margin-top:12px}
   .punto{display:inline-block;width:10px;height:10px;background:#FFB8D1;border-radius:50%;margin:0 5px;cursor:pointer}
   .punto.activo{background:#FF6B9D}

    /* BOTON */
   .btn-agendar{background:#FFB8D1;color:white;padding:14px 30px;border-radius:50px;text-decoration:none;font-weight:bold;display:block;text-align:center;margin-top:20px;border:none;cursor:pointer;font-size:1rem;width:100%}
   .btn-agendar:hover{background:#FF6B9D}

    /* POPUP */
   .popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;justify-content:center;align-items:center}
   .popup-contenido{background:white;width:90%;max-width:700px;height:80%;border-radius:20px;position:relative;padding:20px}
   .cerrar{position:absolute;top:10px;right:20px;font-size:30px;cursor:pointer;color:#999}
   .popup iframe{width:100%;height:100%;border:none;border-radius:15px}
  </style>
</head>
<body>

<header class="header">
  <h1 class="logo">esteticaX</h1>
  <p class="slogan">Nails & Beauty en Tres Arroyos 💅</p>
</header>

<section class="section">
  <h2>SERVICIOS</h2>

  <!-- SERVICIO 1 -->
  <div class="servicio-card">
    <h3 class="servicio-nombre">ESMALTADO SEMIPERMANENTE MANOS</h3>
    <p class="servicio-precio">$18.000 ARS</p>

    <div class="carrusel-contenedor" data-id="1">
      <div class="carrusel">
        <div class="slide activo"><img src="" alt="Manos 1"></div>
        <div class="slide"><img src="" alt="Manos 2"></div>
        <div class="slide"><img src="" alt="Manos 3"></div>
      </div>
      <button class="flecha prev" onclick="cambiarSlide(-1,1)">❮</button>
      <button class="flecha next" onclick="cambiarSlide(1,1)">❯</button>
      <div class="puntos">
        <span class="punto activo" onclick="irASlide(0,1)"></span>
        <span class="punto" onclick="irASlide(1,1)"></span>
        <span class="punto" onclick="irASlide(2,1)"></span>
      </div>
    </div>
    <button class="btn-agendar" onclick="abrirCalendly()">AGENDAR TURNO</button>
  </div>

  <!-- REPETIR ESTRUCTURA PARA LOS DEMÁS SERVICIOS - CAMBIA data-id -->
  <!-- SERVICIO 2 -->
  <div class="servicio-card">
    <h3 class="servicio-nombre">ESMALTADO SEMIPERMANENTE PIES</h3>
    <p class="servicio-precio">$20.000 ARS</p>
    <div class="carrusel-contenedor" data-id="2">
      <div class="carrusel">
        <div class="slide activo"><img src="" alt="Pies 1"></div>
        <div class="slide"><img src="" alt="Pies 2"></div>
        <div class="slide"><img src="" alt="Pies 3"></div>
      </div>
      <button class="flecha prev" onclick="cambiarSlide(-1,2)">❮</button>
      <button class="flecha next" onclick="cambiarSlide(1,2)">❯</button>
      <div class="puntos"><span class="punto activo"></span><span class="punto"></span><span class="punto"></span></div>
    </div>
    <button class="btn-agendar" onclick="abrirCalendly()">AGENDAR TURNO</button>
  </div>

  <!-- SERVICIO 3 CAPPING -->
  <div class="servicio-card">
    <h3 class="servicio-nombre">CAPPING GEL</h3>
    <p class="servicio-precio">$20.000 ARS</p>
    <div class="carrusel-contenedor" data-id="3">
      <div class="carrusel">
        <div class="slide activo"><img src="" alt="Capping 1"></div>
        <div class="slide"><img src="" alt="Capping 2"></div>
        <div class="slide"><img src="" alt="Capping 3"></div>
      </div>
      <button class="flecha prev" onclick="cambiarSlide(-1,3)">❮</button>
      <button class="flecha next" onclick="cambiarSlide(1,3)">❯</button>
      <div class="puntos"><span class="punto activo"></span><span class="punto"></span><span class="punto"></span></div>
    </div>
    <button class="btn-agendar" onclick="abrirCalendly()">AGENDAR TURNO</button>
  </div>

  <!-- SERVICIO 4 SOFT GEL -->
  <div class="servicio-card">
    <h3 class="servicio-nombre">EXTENSIÓN SOFT GEL</h3>
    <p class="servicio-precio">$23.000 ARS</p>
    <div class="carrusel-contenedor" data-id="4">
      <div class="carrusel">
        <div class="slide activo"><img src="" alt="Soft 1"></div>
        <div class="slide"><img src="" alt="Soft 2"></div>
        <div class="slide"><img src="" alt="Soft 3"></div>
      </div>
      <button class="flecha prev" onclick="cambiarSlide(-1,4)">❮</button>
      <button class="flecha next" onclick="cambiarSlide(1,4)">❯</button>
      <div class="puntos"><span class="punto activo"></span><span class="punto"></span><span class="punto"></span></div>
    </div>
    <button class="btn-agendar" onclick="abrirCalendly()">AGENDAR TURNO</button>
  </div>

  <!-- SERVICIO 5 RETIRO -->
  <div class="servicio-card">
    <h3 class="servicio-nombre">RETIRO</h3>
    <p class="servicio-precio">$6.000 ARS</p>
    <div class="carrusel-contenedor" data-id="5">
      <div class="carrusel">
        <div class="slide activo"><img src="" alt="Retiro 1"></div>
        <div class="slide"><img src="" alt="Retiro 2"></div>
        <div class="slide"><img src="" alt="Retiro 3"></div>
      </div>
      <button class="flecha prev" onclick="cambiarSlide(-1,5)">❮</button>
      <button class="flecha next" onclick="cambiarSlide(1,5)">❯</button>
      <div class="puntos"><span class="punto activo"></span><span class="punto"></span><span class="punto"></span></div>
    </div>
    <button class="btn-agendar" onclick="abrirCalendly()">AGENDAR TURNO</button>
  </div>

  <!-- SERVICIO 6 RETIRO SIN -->
  <div class="servicio-card">
    <h3 class="servicio-nombre">RETIRO SIN COLOCACIÓN</h3>
    <p class="servicio-precio">$14.000 ARS</p>
    <div class="carrusel-contenedor" data-id="6">
      <div class="carrusel">
        <div class="slide activo"><img src="" alt="Retiro Sin 1"></div>
        <div class="slide"><img src="" alt="Retiro Sin 2"></div>
        <div class="slide"><img src="" alt="Retiro Sin 3"></div>
      </div>
      <button class="flecha prev" onclick="cambiarSlide(-1,6)">❮</button>
      <button class="flecha next" onclick="cambiarSlide(1,6)">❯</button>
      <div class="puntos"><span class="punto activo"></span><span class="punto"></span><span class="punto"></span></div>
    </div>
    <button class="btn-agendar" onclick="abrirCalendly()">AGENDAR TURNO</button>
  </div>

</section>

<!-- POPUP CALENDLY -->
<div id="popupCalendly" class="popup">
  <div class="popup-contenido">
    <span class="cerrar" onclick="cerrarCalendly()">&times;</span>
    <iframe src="https://calendly.com/beautystudio-flor/nails"></iframe>
  </div>
</div>

<script>
  let slides = {};
  let intervalos = {};

  // Inicializar cada carrusel
  document.querySelectorAll('.carrusel-contenedor').forEach(cont => {
    let id = cont.getAttribute('data-id');
    slides[id] = 0;
    iniciarAutoSlide(id);
  });

  function cambiarSlide(direccion, id) {
    let contenedor = document.querySelector(`.carrusel-contenedor[data-id="${id}"]`);
    let slidesEl = contenedor.querySelectorAll('.slide');
    let puntosEl = contenedor.querySelectorAll('.punto');

    slidesEl[slides[id]].classList.remove('activo');
    puntosEl[slides[id]].classList.remove('activo');

    slides[id] = (slides[id] + direccion + slidesEl.length) % slidesEl.length;

    slidesEl[slides[id]].classList.add('activo');
    puntosEl[slides[id]].classList.add('activo');

    reiniciarAutoSlide(id);
  }

  function irASlide(n, id) {
    let contenedor = document.querySelector(`.carrusel-contenedor[data-id="${id}"]`);
    let slidesEl = contenedor.querySelectorAll('.slide');
    let puntosEl = contenedor.querySelectorAll('.punto');

    slidesEl[slides[id]].classList.remove('activo');
    puntosEl[slides[id]].classList.remove('activo');

    slides[id] = n;

    slidesEl[slides[id]].classList.add('activo');
    puntosEl[slides[id]].classList.add('activo');

    reiniciarAutoSlide(id);
  }

  function iniciarAutoSlide(id) {
    intervalos[id] = setInterval(() => {
      cambiarSlide(1, id);
    }, 3000); // Cambia cada 3 segundos
  }

  function reiniciarAutoSlide(id) {
    clearInterval(intervalos[id]);
    iniciarAutoSlide(id);
  }

  function abrirCalendly() {
    document.getElementById('popupCalendly').style.display = 'flex';
  }
  function cerrarCalendly() {
    document.getElementById('popupCalendly').style.display = 'none';
  }
</script>

</body>
</html>
